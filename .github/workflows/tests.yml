name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tws_mcp -p 'test_*.py' -v
      - name: Installed package smoke test outside the checkout
        working-directory: /tmp
        run: python -m tws_mcp.smoke_test
