[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tws-mcp"
version = "0.1.0"
description = "Local MCP tools for Interactive Brokers TWS market data and resumable history collection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp==1.30.0",
    "ib_insync==0.9.86",
    "pydantic>=2.11,<3",
    "tzdata>=2024.1",
]

[project.scripts]
tws-mcp = "tws_mcp.server:main"

[project.urls]
Repository = "https://github.com/csbring/tws-mcp"
Issues = "https://github.com/csbring/tws-mcp/issues"

[tool.setuptools.packages.find]
include = ["tws_mcp*"]

[tool.setuptools]
include-package-data = false
